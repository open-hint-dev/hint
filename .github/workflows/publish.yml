# Authentication is npm trusted publishing: the `id-token: write` permission below lets
# npm exchange this workflow's OIDC identity for a short-lived publish token, so no npm
# secret is stored in the repository. Configure it once per package on npmjs.com, under
# Settings -> Trusted Publisher, pointing at `open-hint-dev/hint` and `publish.yml`.
#
# `NODE_AUTH_TOKEN` below stays as a fallback: if an `NPM_TOKEN` secret exists it is used
# when OIDC is unavailable, and if it does not exist the variable is simply empty.

name: Publish

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish, without the leading v (e.g. 1.2.3)'
                required: true
                type: string

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  # Yarn is only usable once corepack is enabled below, so setup-node
                  # must not probe it for a cache directory with the global yarn 1.
                  package-manager-cache: false

            - name: Enable Yarn
              run: corepack enable

            - name: Locate the Yarn cache
              id: yarn-cache
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.yarn-cache.outputs.dir }}
                  key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
                  restore-keys: yarn-${{ runner.os }}-

            - name: Resolve the version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  version="${INPUT_VERSION:-${REF_NAME#v}}"

                  if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                      echo "::error::'$version' is not a semver version — expected 1.2.3 or 1.2.3-beta.1"
                      exit 1
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"

                  case "$version" in
                      *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
                      *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint
              run: make lint

            - name: Test
              run: make test

            - name: Publish
              run: make publish
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
                  NPM_CONFIG_TAG: ${{ steps.version.outputs.tag }}

            - name: Create the GitHub release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REF_NAME: ${{ github.ref_name }}
                  PRERELEASE: ${{ steps.version.outputs.tag == 'next' && '--prerelease' || '' }}
              run: gh release create "$REF_NAME" --verify-tag --generate-notes $PRERELEASE
