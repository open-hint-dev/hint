name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Lint, test, build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  # Yarn is only usable once corepack is enabled below, so setup-node
                  # must not probe it for a cache directory with the global yarn 1.
                  package-manager-cache: false

            - name: Enable Yarn
              run: corepack enable

            - name: Locate the Yarn cache
              id: yarn-cache
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.yarn-cache.outputs.dir }}
                  key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
                  restore-keys: yarn-${{ runner.os }}-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint
              run: make lint

            # llms-full.txt is docs/ concatenated. Nothing else would notice it drifting, and it is
            # the copy an LLM reads — so it is the copy most likely to be wrong for longest.
            - name: Check the generated documentation bundle
              run: |
                  node sites/openhint.dev/build-llms.mjs --check
                  node sites/openhint.dev/check-site.mjs

            - name: Test
              run: make test

            - name: Retrieval evaluation
              run: make eval

            - name: Benchmarks
              run: make bench

            - name: Build release artifacts
              run: make release
              env:
                  VERSION: 0.0.0-ci.${{ github.run_number }}
