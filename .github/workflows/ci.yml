name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: yarn site:check
      - run: ./scripts/site-package.sh "$RUNNER_TEMP/openhint-site"
      - run: yarn pack --out hint.tgz
      - name: Smoke the packed CLI outside Git
        shell: bash
        run: |
          smoke="$(mktemp -d)"
          npm install --prefix "$smoke" "$GITHUB_WORKSPACE/hint.tgz"
          cd "$smoke"
          ./node_modules/.bin/hint --version
          ./node_modules/.bin/hint guide
          ./node_modules/.bin/hint hypothesis future.ts --text "The packed CLI writes without repository context" --id H-packed
          ./node_modules/.bin/hint future.ts --open
